    <main class="container">
        <h1>Зворотний зв'язок</h1>

        <form action="https://httpbin.org/post" method="post" class="card">
            <!-- 1. Явний зв'язок -->
            <label for="name">Ім'я</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <!-- 2. Явний зв'язок -->
            <label for="email">Електронна пошта</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <!-- 3. Явний зв'язок (<select>) -->
            <label for="subject">Тема звернення</label>
            <select id="subject" name="subject">
                <option value="question">Запитання</option>
                <option value="suggestion">Пропозиція</option>
                <option value="error">Повідомлення про помилку на сайті</option>
            </select>
            <br><br>

            <!-- 4. Явний зв'язок (<textarea>) -->
            <label for="message">Текст повідомлення</label><br>
            <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
            <br><br>

            <!-- 5. Вкладення: label обгортає поле, атрибути for/id не потрібні -->
            <label>
                <input type="checkbox" name="consent" required>
                Погоджуюсь на обробку персональних даних
            </label>
            <br><br>

           <button type="submit" class="btn">Надіслати</button>
        </form>
    </main>
